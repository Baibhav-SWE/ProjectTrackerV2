{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='awi_logo.jpg') }}" alt="Logo" class="login-logo">
            <h2 class="login-title">Reset Password</h2>
            <p class="login-subtitle">Enter your new password (8+ characters, one uppercase, one special character).</p>
        </div>
        
        <form method="POST" action="{{ url_for('reset_password', token=token) }}" autocomplete="off">
            <div class="form-group">
                <label for="reset-new-password">New Password</label>
                <input type="password" class="form-control" id="reset-new-password" name="password" required
                       autocomplete="new-password" autocapitalize="off" spellcheck="false">
            </div>
            <div class="form-group">
                <label for="reset-confirm-password">Confirm New Password</label>
                <input type="password" class="form-control" id="reset-confirm-password" name="confirm_password" required
                       autocomplete="new-password" autocapitalize="off" spellcheck="false">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" class="login-link">Back to Login</a>
        </div>
    </div>
</div>

<style>
.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 56px);
    background: #000;
    padding: 20px;
}

.login-card {
    background: #1a1a1a;
    padding: 40px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
}

.login-logo {
    height: 60px;
    margin-bottom: 20px;
}

.login-title {
    color: #ff1825;
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 10px;
}

.login-subtitle {
    color: #666;
    font-size: 16px;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    color: #fff;
    font-size: 14px;
    margin-bottom: 8px;
    display: block;
}

.form-control {
    background: #333;
    border: 1px solid #444;
    color: #fff;
    padding: 12px;
    border-radius: 4px;
    width: 100%;
    transition: border-color 0.3s;
}

.form-control:focus {
    border-color: #ff1825;
    outline: none;
    box-shadow: none;
}

/* Chrome/Safari autofill: default yellow background + dark text looks “empty” on dark theme */
.login-card input.form-control:-webkit-autofill,
.login-card input.form-control:-webkit-autofill:hover,
.login-card input.form-control:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 1000px #333 inset !important;
    box-shadow: 0 0 0 1000px #333 inset !important;
    -webkit-text-fill-color: #fff !important;
    caret-color: #fff;
}

.btn-primary {
    background: #ff1825;
    border: none;
    padding: 12px;
    font-weight: 500;
    transition: background-color 0.3s;
}

.btn-primary:hover {
    background: #e61520;
}

.login-link {
    color: #ff1825;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.3s;
}

.login-link:hover {
    color: #e61520;
    text-decoration: none;
}

.alert {
    margin-bottom: 20px;
    border-radius: 4px;
    padding: 12px;
    font-size: 14px;
}

.alert-success {
    background: #d4edda;
    border-color: #c3e6cb;
    color: #155724;
}

.alert-error {
    background: #f8d7da;
    border-color: #f5c6cb;
    color: #721c24;
}
</style>
{% endblock %}
